<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titolo %}Account{% endblock %} - CS Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stile.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">
{% include 'navbar.html' %}
<main class="container py-5 flex-grow-1">
    {% with messaggi = get_flashed_messages(with_categories=true) %}{% for categoria, messaggio in messaggi %}
    <div class="alert alert-{{ categoria }}" role="status">{{ messaggio }}</div>
    {% endfor %}{% endwith %}
    {% if errore %}<div class="alert alert-danger" role="alert">{{ errore }}</div>{% endif %}
    {% block contenuto %}{% endblock %}
</main>
{% include 'footer.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
