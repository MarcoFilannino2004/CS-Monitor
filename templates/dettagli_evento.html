<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettagli evento - CyberSec Monitor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stile.css') }}">
</head>

<body>

    <main class="container py-5">

        <h1>Dettagli evento #{{ evento.id_evento }}</h1>

        <div class="mt-4">
            <p><strong>Categoria:</strong> {{ evento.categoria }}</p>
            <p><strong>Indirizzo IP:</strong> {{ evento.indirizzo_ip }}</p>
            <p><strong>Descrizione:</strong> {{ evento.descrizione }}</p>
            <p><strong>Gravità:</strong> {{ evento.gravita }}</p>
            <p><strong>Stato:</strong> {{ evento.stato }}</p>
            <p><strong>Data evento:</strong> {{ evento.data_evento }}</p>
        </div>

        <a href="{{ url_for('modificaEventoPagina', id_evento=evento.id_evento) }}" class="btn btn-warning">
            Modifica evento
        </a>

        <form action="{{ url_for('eliminaEventoPagina', id_evento=evento.id_evento) }}" method="POST" onsubmit="return confirm('Sei sicuro di voler eliminare questo evento?');" class="d-inline">

            <button type="submit" class="btn btn-danger">Elimina evento</button>

        </form>

        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
            Torna alla dashboard
        </a>

    </main>

</body>
</html>
