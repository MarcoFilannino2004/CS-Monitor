<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica evento - CS Monitor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stile.css') }}">
</head>

<body class="d-flex flex-column min-vh-100">
    {% include 'navbar.html' %}

    <main class="container py-5 flex-grow-1">

        <h1 class="mb-4">Modifica evento ID: {{ evento.id_evento }}</h1>

        {% if errore %}
            <div class="alert alert-danger">{{ errore }}</div>
        {% endif %}

        <form action="{{ url_for('modificaEventoPagina', id_evento=evento.id_evento) }}" method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label for="id_categoria" class="form-label">Categoria</label>
                <select class="form-select" id="id_categoria" name="id_categoria" required>
                    {% for categoria in categorie %}
                        <option value="{{ categoria.id_categoria }}" {% if categoria.id_categoria|string == dati.get('id_categoria', '')|string %}selected{% endif %}>
                            {{ categoria.nome }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="indirizzo_ip" class="form-label">Indirizzo IP</label>
                <input type="text" class="form-control" id="indirizzo_ip" name="indirizzo_ip" value="{{ dati.get('indirizzo_ip', '') }}" required>
            </div>

            <div class="mb-3">
                <label for="descrizione" class="form-label">Descrizione</label>
                <textarea class="form-control" id="descrizione" name="descrizione" rows="4" required>{{ dati.get('descrizione', '') }}</textarea>
            </div>

            <div class="mb-3">
                <label for="gravita" class="form-label">Gravità</label>
                <select class="form-select" id="gravita" name="gravita" required>
                    {% for gravita in ["Bassa", "Media", "Alta", "Critica"] %}
                        <option value="{{ gravita }}" {% if gravita == dati.get('gravita') %}selected{% endif %}>{{ gravita }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="stato" class="form-label">Stato</label>
                <select class="form-select" id="stato" name="stato" required>
                    {% for stato in ["Nuovo", "In analisi", "Risolto"] %}
                        <option value="{{ stato }}" {% if stato == dati.get('stato') %}selected{% endif %}>{{ stato }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-applicaFiltri">Salva modifiche</button>
            <a href="{{ url_for('dettagliEvento', id_evento=evento.id_evento) }}" class="btn btn-secondary">Annulla</a>

        </form>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
